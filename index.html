<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#041a22" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>MediBin Hero — Hospital Waste Sorting Game</title>
    <meta
      name="description"
      content="MediBin Hero is a free 3D browser game that teaches hospital waste segregation: drop each waste item into the right colour-coded bin. English + Tamil."
    />
    <meta property="og:title" content="MediBin Hero — Hospital Waste Sorting Game" />
    <meta property="og:description" content="Right waste. Right bin. Every time. A 3D game for hospital staff and the public." />
    <meta property="og:image" content="/cover.jpg" />

    <!-- Fonts: fetched straight away (preload) and declared here, before any script or stylesheet,
         so the page's first text is already in the right typeface. font-display: block means a
         fallback font is never shown and then swapped. -->
    <link rel="preload" href="/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/baloo-thambi-2-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/baloo-thambi-2-tamil.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      html {
        background: #03151c;
      }
      @font-face {
        font-family: 'Outfit Variable';
        font-style: normal;
        font-display: block;
        font-weight: 100 900;
        src: url(/fonts/outfit-latin.woff2) format('woff2-variations');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Outfit Variable';
        font-style: normal;
        font-display: block;
        font-weight: 100 900;
        src: url(/fonts/outfit-latin-ext.woff2) format('woff2-variations');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'Baloo Thambi 2 Variable';
        font-style: normal;
        font-display: block;
        font-weight: 400 800;
        src: url(/fonts/baloo-thambi-2-latin.woff2) format('woff2-variations');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Baloo Thambi 2 Variable';
        font-style: normal;
        font-display: block;
        font-weight: 400 800;
        src: url(/fonts/baloo-thambi-2-latin-ext.woff2) format('woff2-variations');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'Baloo Thambi 2 Variable';
        font-style: normal;
        font-display: block;
        font-weight: 400 800;
        src: url(/fonts/baloo-thambi-2-tamil.woff2) format('woff2-variations');
        unicode-range: U+0964-0965, U+0B82-0BFA, U+200C-200D, U+20B9, U+25CC;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
