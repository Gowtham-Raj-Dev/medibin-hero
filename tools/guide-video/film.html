<!doctype html>
<!-- The stage the bin-guide video is filmed on (see capture.mjs). Open it through the dev server:
     http://localhost:5173/tools/guide-video/film.html?lang=ta&preview   plays it in real time. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Bin guide film</title>
    <style>
      @font-face {
        font-family: 'Outfit Variable';
        font-display: block;
        font-weight: 100 900;
        src: url(/fonts/outfit-latin.woff2) format('woff2-variations');
      }
      @font-face {
        font-family: 'Baloo Thambi 2 Variable';
        font-display: block;
        font-weight: 400 800;
        src: url(/fonts/baloo-thambi-2-latin.woff2) format('woff2-variations');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Baloo Thambi 2 Variable';
        font-display: block;
        font-weight: 400 800;
        src: url(/fonts/baloo-thambi-2-tamil.woff2) format('woff2-variations');
        unicode-range: U+0964-0965, U+0B82-0BFA, U+200C-200D, U+20B9, U+25CC;
      }

      :root {
        --display: 'Baloo Thambi 2 Variable', 'Nirmala UI', sans-serif;
        --ink: #f1fbf8;
        --ink-dim: #a8c7c9;
        --mint: #2ee6a8;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: #000;
        overflow: hidden;
      }
      #film {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        font-family: var(--display);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      #stage,
      #ui,
      #ui > .scrim,
      #ui > .fade {
        position: absolute;
        inset: 0;
      }
      #stage canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #ui > * {
        will-change: opacity, transform;
      }

      /* small brand mark while a bin is on screen */
      .brand {
        position: absolute;
        left: 34px;
        top: 28px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 18px 8px 8px;
        border-radius: 18px;
        background: rgba(3, 21, 28, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.16);
        font-weight: 800;
        font-size: 21px;
      }
      .brand span {
        color: var(--ink-dim);
        font-weight: 600;
        font-size: 17px;
      }
      .brand .dots {
        display: flex;
        gap: 6px;
        margin-left: 6px;
      }
      .brand .dots i {
        width: 13px;
        height: 13px;
        border-radius: 50%;
        opacity: 0.3;
      }

      /* opening title */
      .scrim {
        background: linear-gradient(180deg, rgba(3, 21, 28, 0.95) 0%, rgba(3, 21, 28, 0.88) 36%, rgba(3, 21, 28, 0) 60%);
      }
      .title {
        position: absolute;
        left: 0;
        right: 0;
        top: 54px;
        text-align: center;
      }
      .title .name {
        display: inline-flex;
        align-items: center;
        gap: 18px;
        font-weight: 800;
        font-size: 72px;
        line-height: 1;
        letter-spacing: -0.01em;
      }
      .title .head {
        margin-top: 14px;
        font-weight: 700;
        font-size: 40px;
        line-height: 1.2;
        background: linear-gradient(90deg, #f5c518, #ff8a5b 35%, #5cb4ff 68%, #4fe08a);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .title .sub2 {
        margin-top: 6px;
        font-weight: 600;
        font-size: 22px;
        color: var(--ink-dim);
      }

      /* the list of one bin, on the right */
      .panel {
        position: absolute;
        right: 34px;
        top: 28px;
        width: 424px;
        padding: 22px 20px 20px;
        border-radius: 24px;
        border: 1px solid color-mix(in srgb, var(--bin) 55%, transparent);
        background: linear-gradient(180deg, color-mix(in srgb, var(--bin) 26%, rgba(3, 21, 28, 0.9)), rgba(3, 21, 28, 0.9) 42%);
        box-shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.7);
        overflow: hidden;
      }
      .panel::before {
        content: '';
        position: absolute;
        inset: 0 0 auto 0;
        height: 7px;
        background: var(--bin);
      }
      .panel header {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 14px;
      }
      .swatch {
        flex: none;
        width: 46px;
        height: 52px;
        margin-top: 6px;
        border-radius: 8px 8px 12px 12px;
        background: linear-gradient(180deg, var(--bin), var(--bin-deep));
        box-shadow: 0 -7px 0 -1px var(--bin-deep);
        clip-path: polygon(0 -8px, 100% -8px, 88% 100%, 12% 100%);
      }
      .panel h2 {
        margin: 0;
        font-size: 31px;
        line-height: 1.1;
      }
      .panel header span {
        font-weight: 700;
        font-size: 20px;
        color: var(--bin-soft);
      }
      .panel ul {
        display: grid;
        gap: 7px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .panel li {
        position: relative;
        padding: 7px 40px 7px 14px;
        border-left: 4px solid color-mix(in srgb, var(--bin) 80%, transparent);
        border-radius: 0 12px 12px 0;
        font-weight: 600;
        font-size: 20px;
        line-height: 1.28;
      }
      .panel li svg {
        position: absolute;
        right: 9px;
        top: 50%;
        width: 24px;
        height: 24px;
        margin-top: -12px;
      }

      /* name of the item being shown */
      .cap {
        position: absolute;
        left: 252px;
        width: 560px;
        top: 392px;
        display: flex;
        justify-content: center;
      }
      .cap b {
        max-width: 100%;
        padding: 10px 24px;
        border-radius: 20px;
        background: rgba(3, 21, 28, 0.84);
        border: 2px solid var(--bin, #fff);
        font-weight: 800;
        font-size: 31px;
        line-height: 1.22;
        text-align: center;
        text-wrap: balance;
      }

      /* spoken line (opening only) */
      .sub {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 34px;
        display: flex;
        justify-content: center;
      }
      .sub b {
        max-width: 1000px;
        padding: 9px 26px;
        border-radius: 18px;
        background: rgba(3, 21, 28, 0.84);
        font-weight: 700;
        font-size: 29px;
        line-height: 1.25;
        text-align: center;
      }

      /* recap labels over the bins */
      .chip {
        position: absolute;
        left: 0;
        top: 0;
        width: 216px;
        margin-left: -108px;
        padding: 9px 10px 10px;
        border-radius: 18px;
        background: var(--bin);
        color: var(--bin-ink);
        border: 3px solid #fff;
        box-shadow: 0 14px 30px -12px rgba(0, 0, 0, 0.6);
        text-align: center;
        line-height: 1.15;
      }
      .chip b {
        display: block;
        font-weight: 800;
        font-size: 25px;
      }
      .chip span {
        display: block;
        margin-top: 2px;
        font-weight: 700;
        font-size: 18.5px;
      }

      /* closing card */
      .end {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: radial-gradient(900px 520px at 50% 42%, rgba(6, 40, 52, 0.9), rgba(3, 21, 28, 0.95));
        text-align: center;
      }
      .end .name {
        display: inline-flex;
        align-items: center;
        gap: 18px;
        font-weight: 800;
        font-size: 66px;
        line-height: 1;
      }
      .end .tag {
        font-weight: 700;
        font-size: 44px;
        line-height: 1.2;
        background: linear-gradient(90deg, #f5c518, #ff8a5b 35%, #5cb4ff 68%, #4fe08a);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .end .cta {
        display: inline-flex;
        align-items: center;
        gap: 16px;
        margin-top: 22px;
        padding: 18px 46px;
        border-radius: 999px;
        color: #04261c;
        background: linear-gradient(135deg, #7dffd0 0%, #2ee6a8 45%, #14c98f 100%);
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.45) inset, 0 6px 0 #0a8f68, 0 0 0 12px rgba(46, 230, 168, 0.14), 0 26px 60px -12px rgba(46, 230, 168, 0.9);
        font-weight: 800;
        font-size: 42px;
        line-height: 1.15;
      }
      .end .cta-sub {
        margin-top: 12px;
        color: var(--ink-dim);
        font-weight: 600;
        font-size: 22px;
      }
      .end .row {
        display: flex;
        gap: 12px;
        margin-top: 6px;
      }
      .end .row i {
        width: 54px;
        height: 12px;
        border-radius: 6px;
      }
      .fade {
        background: #000;
      }
    </style>
  </head>
  <body>
    <div id="film">
      <div id="stage"></div>
      <div id="ui"></div>
    </div>
    <script type="module" src="./film.js"></script>
  </body>
</html>
